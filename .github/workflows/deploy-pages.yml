name: Deploy C++ course to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate course data and JavaScript
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r"const DATA = (\{[\s\S]*?\});\s*\n", html)
          assert match, "Embedded course DATA was not found"
          data = json.loads(match.group(1))
          curriculum = json.loads(Path("curriculum.json").read_text(encoding="utf-8"))
          assert data == curriculum, "index.html and curriculum.json are out of sync"

          lessons = [
              lesson
              for track in data["tracks"]
              for module in track["modules"]
              for lesson in module["lessons"]
          ]
          ids = [lesson["id"] for lesson in lessons]
          assert len(ids) == len(set(ids)), "Duplicate lesson IDs found"
          assert len(lessons) == 67, f"Expected 67 lessons, found {len(lessons)}"
          nav_ids = [item["id"] for track in data.get("navigation", []) for item in track.get("lessons", [])]
          assert len(nav_ids) == len(lessons) and set(nav_ids) == set(ids), "Navigation must include every lesson exactly once"
          assert "function highlightCode(" in html, "Code highlighter definition is missing"

          project = next(
              lesson
              for track in data["tracks"]
              for module in track["modules"]
              for lesson in module["lessons"]
              if lesson["id"] == "T11-M1-L1"
          )
          assert "signal-analyzer/README.md" in Path(project["markdown_path"]).read_text(encoding="utf-8"), "Project lesson must link the runnable engineering example"

          scripts = re.findall(r"<script\b[^>]*>([\s\S]*?)</script>", html)
          assert scripts, "Inline JavaScript was not found"
          Path("/tmp/course-script.js").write_text("\n".join(scripts), encoding="utf-8")
          print(f"Validated {len(lessons)} lessons across {len(data['tracks'])} tracks.")
          PY
          node --check /tmp/course-script.js

      - name: Build static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test published page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 5 "$PAGE_URL" -o /tmp/published.html
          grep -Fq '<title>Вводный курс C++</title>' /tmp/published.html
          grep -Fq 'function highlightCode(' /tmp/published.html
